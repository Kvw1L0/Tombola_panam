<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tómbola PANAM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>
    <style>
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #ffffff;
            overflow: hidden;
            
            /* Fondo limpio: solo tu imagen sin texturas ni overlays oscuros añadidos */
            background-color: #0d0d0d;
            background-image: url('fondo.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* --- Contenedor Principal --- */
        #main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Ajusta este valor para subir o bajar la tómbola según dónde estén los textos en tu fondo.png */
            margin-top: 220px; 
            position: relative;
            z-index: 10;
        }

        /* El contenedor ya no tiene fondo oscuro, es 100% transparente */
        #contenedor-simulacion {
            position: relative;
        }

        /* --- Animación Central --- */
        #numero-animado {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: white;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 70px;
            font-weight: bold;
            z-index: 30;
            opacity: 0;
            box-shadow: 0 0 25px rgba(255,255,255,1), 0 0 50px rgba(252, 213, 53, 0.7);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #numero-animado.animar {
            animation: salirYEncoger 2.5s forwards ease-in-out;
        }

        @keyframes salirYEncoger {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            20% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            85% { transform: translate(-50%, 300px) scale(0.3); opacity: 0.5; }
            100% { transform: translate(-50%, 300px) scale(0.1); opacity: 0; }
        }

        /* --- Tablero --- */
        #tablero {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 12px;
            /* Fondo del tablero sutilmente transparente para integrar mejor el diseño */
            background: rgba(26, 26, 26, 0.7); 
            padding: 20px;
            border-radius: 12px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), 0 5px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 50px;
            width: 700px;
        }

        .bolita-tablero {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: inset -3px -3px 5px rgba(0,0,0,0.4), 1px 2px 3px rgba(0,0,0,0.3);
            transform: scale(0);
            animation: popInBolita 0.4s 2.2s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
        }

        @keyframes popInBolita {
            to { transform: scale(1); }
        }

        #mensajeFinal {
            position: fixed;
            bottom: 20px;
            font-size: 1.5em;
            color: #fcd535;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="numero-animado">00</div>
        <div id="contenedor-simulacion"></div>
        <div id="tablero"></div>
    </div>

    <div id="mensajeFinal"></div>

    <script>
        // --- Configuración y Módulos ---
        const contenedor = document.getElementById('contenedor-simulacion');
        const numeroAnimadoEl = document.getElementById('numero-animado');
        
        // Canvas más grande que la tómbola para evitar que se corten los bordes
        const tamanoCanvas = 500; 
        const diametroTombola = 420; 
        const centro = tamanoCanvas / 2;
        const radioTombola = diametroTombola / 2;
        const radioBolita = 18;
        const VELOCIDAD_CONSTANTE = 6.5;

        const { Engine, Render, Runner, World, Bodies, Body, Events, Vector } = Matter;

        const engine = Engine.create();
        const world = engine.world;
        world.gravity.y = 0; 

        const render = Render.create({
            element: contenedor,
            engine: engine,
            options: {
                width: tamanoCanvas,
                height: tamanoCanvas,
                wireframes: false,
                background: 'transparent' // Totalmente transparente
            }
        });

        // --- Crear el Anillo de la Tómbola ---
        const numParedes = 90; // Mayor cantidad de polígonos para un círculo visualmente suave
        const espesorPared = 20;

        for (let i = 0; i < numParedes; i++) {
            const angle = (i / numParedes) * Math.PI * 2;
            const x = centro + radioTombola * Math.cos(angle);
            const y = centro + radioTombola * Math.sin(angle);
            
            const pared = Bodies.rectangle(x, y, 40, espesorPared, {
                isStatic: true,
                angle: angle,
                render: { fillStyle: '#262626' }, // Color del anillo
                friction: 0,
                restitution: 1,
                collisionFilter: { group: -1 } 
            });
            World.add(world, pared);
        }

        // --- Crear las 20 Bolitas ---
        const bolitasEnSimulacion = [];
        const coloresValidos = [
            '#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', 
            '#e67e22', '#34495e', '#1abc9c', '#d35400', '#27ae60'
        ];

        for (let i = 1; i <= 20; i++) {
            const color = coloresValidos[i % coloresValidos.length];
            const bolita = Bodies.circle(
                centro + (Math.random() - 0.5) * 150,
                centro + (Math.random() - 0.5) * 150,
                radioBolita,
                {
                    restitution: 1,
                    friction: 0,
                    frictionAir: 0,
                    render: { 
                        fillStyle: color,
                        strokeStyle: '#ffffff',
                        lineWidth: 1
                    },
                    label: i.toString()
                }
            );
            Body.setVelocity(bolita, { 
                x: (Math.random() - 0.5) * VELOCIDAD_CONSTANTE * 2, 
                y: (Math.random() - 0.5) * VELOCIDAD_CONSTANTE * 2 
            });
            bolitasEnSimulacion.push(bolita);
        }
        World.add(world, bolitasEnSimulacion);

        Events.on(engine, 'afterUpdate', () => {
            bolitasEnSimulacion.forEach(bolita => {
                const velocidadActual = Vector.magnitude(bolita.velocity);
                if (velocidadActual > 0) {
                    Body.setVelocity(bolita, Vector.mult(Vector.normalise(bolita.velocity), VELOCIDAD_CONSTANTE));
                }
            });
        });

        // --- Lógica del Sorteo ---
        const tablero = document.getElementById('tablero');
        const mensajeFinal = document.getElementById('mensajeFinal');
        let sorteoEnCurso = false;

        function seleccionarBolita() {
            if (sorteoEnCurso || bolitasEnSimulacion.length === 0) {
                if (bolitasEnSimulacion.length === 0) {
                    mensajeFinal.textContent = "¡Todas las bolitas han sido sorteadas!";
                }
                return;
            }
            sorteoEnCurso = true;
            mensajeFinal.textContent = "";

            const indiceAleatorio = Math.floor(Math.random() * bolitasEnSimulacion.length);
            const bolitaGanadora = bolitasEnSimulacion[indiceAleatorio];
            const numeroGanador = parseInt(bolitaGanadora.label, 10);
            const colorGanador = bolitaGanadora.render.fillStyle;

            World.remove(world, bolitaGanadora);
            bolitasEnSimulacion.splice(indiceAleatorio, 1);
            
            numeroAnimadoEl.textContent = numeroGanador;
            numeroAnimadoEl.style.backgroundColor = colorGanador;
            numeroAnimadoEl.style.color = (parseInt(colorGanador.replace('#',''), 16) > 0xffffff/2) ? 'black' : 'white';
            numeroAnimadoEl.classList.add('animar');

            const bolitaTablero = document.createElement('div');
            bolitaTablero.classList.add('bolita-tablero');
            bolitaTablero.style.backgroundColor = colorGanador;
            bolitaTablero.textContent = numeroGanador;
            bolitaTablero.dataset.numero = numeroGanador;

            numeroAnimadoEl.addEventListener('animationend', (e) => {
                if (e.animationName === 'salirYEncoger') {
                    numeroAnimadoEl.classList.remove('animar');
                    anunciarEnTablero(bolitaTablero);
                    sorteoEnCurso = false;
                }
            }, { once: true });
        }

        function anunciarEnTablero(nuevaBolita) {
            tablero.appendChild(nuevaBolita);
            const bolitasArr = Array.from(tablero.querySelectorAll('.bolita-tablero'));
            bolitasArr.sort((a, b) => parseInt(a.dataset.numero) - parseInt(b.dataset.numero));
            tablero.innerHTML = '';
            bolitasArr.forEach(b => tablero.appendChild(b));
        }

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        window.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault();
                seleccionarBolita();
            }
        });
    </script>
</body>
</html>
