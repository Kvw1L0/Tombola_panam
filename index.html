<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tómbola con Animación Central</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            color: #ecf0f1;
            overflow: hidden;

            /* Fondo personalizado */
            background-image: url('fondo.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            /* Color de respaldo mientras carga la imagen */
            background-color: #2c3e50;
        }

        h1 {
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        #contenedor-simulacion {
            position: relative;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Animación central para el número ganador */
        #numero-animado {
            position: absolute;
            font-size: 80px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.8), 2px 2px 5px rgba(0,0,0,1);
            pointer-events: none;
            opacity: 0;
            transform: scale(0.3);
            transition: all 0.3s ease;
            z-index: 10;
        }

        #numero-animado.animar {
            animation: popInOut 2s forwards;
        }

        @keyframes popInOut {
            0% { opacity: 0; transform: scale(0.3); }
            20% { opacity: 1; transform: scale(1.2); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        /* Estilos del tablero de resultados */
        #tablero {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
            margin-top: 20px;
            gap: 10px;
            min-height: 50px;
        }

        .bolita-tablero {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e74c3c;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: inset -3px -3px 5px rgba(0,0,0,0.4), 2px 2px 5px rgba(0,0,0,0.3);
            animation: aparecer 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes aparecer {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        #mensajeFinal {
            margin-top: 15px;
            font-size: 1.2em;
            color: #e74c3c;
            font-weight: bold;
            height: 25px;
        }
    </style>
</head>
<body>

    <h1>Tómbola PANAM</h1>

    <div style="position: relative; display: flex; justify-content: center; align-items: center;">
        <div id="contenedor-simulacion"></div>
        <div id="numero-animado"></div>
    </div>

    <div id="tablero"></div>
    <div id="mensajeFinal"></div>

    <script>
        // --- Configuración y Módulos ---
        const contenedor = document.getElementById('contenedor-simulacion');
        const numeroAnimadoEl = document.getElementById('numero-animado');
        const diametroTombola = 450;
        const radioBolita = 20;
        const VELOCIDAD_CONSTANTE = 6;

        const { Engine, Render, Runner, World, Bodies, Body, Events, Vector } = Matter;

        const engine = Engine.create();
        const world = engine.world;
        world.gravity.y = 0;

        const render = Render.create({
            element: contenedor, 
            engine: engine,
            options: { 
                width: diametroTombola, 
                height: diametroTombola, 
                wireframes: false, 
                background: 'transparent' 
            }
        });

        // --- Paredes y Bolitas ---
        const radioTombola = diametroTombola / 2;
        for (let i = 0; i < 64; i++) {
            const angle = (i / 64) * Math.PI * 2;
            const x = radioTombola + (radioTombola - 10) * Math.cos(angle);
            const y = radioTombola + (radioTombola - 10) * Math.sin(angle);
            const pared = Bodies.rectangle(x, y, 50, 20, { 
                isStatic: true, 
                angle: angle, 
                render: { fillStyle: '#17202a' }, 
                friction: 0, 
                restitution: 1 
            });
            World.add(world, pared);
        }

        const bolitasEnSimulacion = [];
        for (let i = 1; i <= 20; i++) {
            const bolita = Bodies.circle( 
                radioTombola + (Math.random() - 0.5) * 150, 
                radioTombola + (Math.random() - 0.5) * 150, 
                radioBolita,
                { 
                    restitution: 1, 
                    friction: 0, 
                    frictionAir: 0, 
                    render: { fillStyle: `hsl(${i * 18}, 80%, 60%)` }, 
                    label: i.toString() 
                }
            );
            Body.setVelocity(bolita, { 
                x: (Math.random() - 0.5) * VELOCIDAD_CONSTANTE, 
                y: (Math.random() - 0.5) * VELOCIDAD_CONSTANTE 
            });
            bolitasEnSimulacion.push(bolita);
        }
        World.add(world, bolitasEnSimulacion);

        Events.on(engine, 'afterUpdate', () => {
            bolitasEnSimulacion.forEach(bolita => {
                const velocidadActual = Vector.magnitude(bolita.velocity);
                if (velocidadActual > 0) {
                    Body.setVelocity(bolita, Vector.mult(Vector.normalise(bolita.velocity), VELOCIDAD_CONSTANTE));
                }
            });
        });

        // --- Lógica del Juego ---
        const bolitasSeleccionadas = [];
        const tablero = document.getElementById('tablero');
        const mensajeFinal = document.getElementById('mensajeFinal');
        let sorteoEnCurso = false;

        function seleccionarBolita() {
            if (sorteoEnCurso || bolitasEnSimulacion.length === 0) {
                if (bolitasEnSimulacion.length === 0) {
                    mensajeFinal.textContent = "¡Todas las bolitas han sido sorteadas!";
                }
                return;
            }
            sorteoEnCurso = true;
            mensajeFinal.textContent = "";

            const indiceAleatorio = Math.floor(Math.random() * bolitasEnSimulacion.length);
            const bolitaGanadora = bolitasEnSimulacion[indiceAleatorio];
            const numeroGanador = parseInt(bolitaGanadora.label, 10);

            // Quitar la bolita de la simulación física
            World.remove(world, bolitaGanadora);
            bolitasEnSimulacion.splice(indiceAleatorio, 1);
            
            // Iniciar la animación central
            numeroAnimadoEl.textContent = numeroGanador;
            numeroAnimadoEl.classList.add('animar');

            // Escuchar a que la animación termine
            numeroAnimadoEl.addEventListener('animationend', () => {
                // Añadir el número al tablero
                bolitasSeleccionadas.push(numeroGanador);
                actualizarTablero();

                // Limpiar para la próxima vez
                numeroAnimadoEl.classList.remove('animar');
                sorteoEnCurso = false;
            }, { once: true });
        }

        function actualizarTablero() {
            bolitasSeleccionadas.sort((a, b) => a - b);
            tablero.innerHTML = '';
            bolitasSeleccionadas.forEach(numero => {
                const bolitaElemento = document.createElement('div');
                bolitaElemento.classList.add('bolita-tablero');
                bolitaElemento.textContent = numero;
                tablero.appendChild(bolitaElemento);
            });
        }

        // --- Iniciar la Simulación ---
        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        window.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault();
                seleccionarBolita();
            }
        });
    </script>
</body>
</html>
