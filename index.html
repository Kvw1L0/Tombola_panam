<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tómbola INNOMOTICS - PANAM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>
    <style>
        :root {
            --color-principal: #fcd535; /* Amarillo de la marca */
            --color-fondo: #0d0d0d;
            --color-tablero: #1a1a1a;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #ffffff;
            overflow: hidden;
            
            /* Fondo personalizado con patrón halftone */
            background-color: var(--color-fondo);
            background-image: 
                url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36z8gAFUPhfCBUDMR//v//H8ZABQA8/R4+e8zHkQAAAABJRU5ErkJggg=='),
                url('fondo.png'); /* Ruta a tu imagen de fondo original */
            background-size: auto, cover;
            background-position: center;
            background-blend-mode: overlay;
        }

        /* --- Encabezado --- */
        header {
            text-align: center;
            margin-top: 40px; /* Espacio superior */
            z-index: 20;
        }

        h1#titulo-marca {
            font-size: 72px;
            color: var(--color-principal);
            margin: 0;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -2px;
            font-weight: 900;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
        }

        h2#subtitulo-evento {
            font-size: 24px;
            color: #ffffff;
            margin: 10px 0 0 0;
            font-weight: 300;
            opacity: 0.8;
        }

        /* --- Contenedor de la Tómbola (Punto 1 y 2) --- */
        #main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 100px; /* ESTO BAJA LA TÓMBOLA 40% (aprox 100px) */
            position: relative;
            z-index: 10;
        }

        #contenedor-simulacion {
            position: relative;
            width: 450px;
            height: 450px;
            /* SEGURO DE CÍRCULO COMPLETO */
            border-radius: 50%;
            overflow: visible; /* Importante para que no corte los bordes */
            box-shadow: 0 0 30px rgba(252, 213, 53, 0.1); /* Brillo tenue */
            background: radial-gradient(circle, rgba(20,20,20,0.8) 0%, rgba(10,10,10,0.9) 100%);
        }

        /* --- Animación Central "Bolita Saliendo" (Punto 3) --- */
        #numero-animado {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: white;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 70px;
            font-weight: bold;
            z-index: 30;
            opacity: 0;
            box-shadow: 0 0 25px rgba(255,255,255,1), 0 0 50px rgba(252, 213, 53, 0.7);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #numero-animado.animar {
            animation: salirYEncoger 2.5s forwards ease-in-out;
        }

        @keyframes salirYEncoger {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } /* Aparece y rebota */
            20% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            70% { transform: translate(-50%, -50%) scale(1); opacity: 1; } /* Pausa para ver el número */
            85% { transform: translate(-50%, 300px) scale(0.3); opacity: 0.5; } /* Baja hacia el tablero */
            100% { transform: translate(-50%, 300px) scale(0.1); opacity: 0; } /* Desaparece */
        }

        /* --- Tablero de Números Anunciados (Armónico) --- */
        #tablero {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(10, 1fr); /* 10 por fila */
            gap: 12px;
            background: var(--color-tablero);
            padding: 20px;
            border-radius: 12px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), 0 5px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(252, 213, 53, 0.1);
            min-height: 120px; /* Altura para 2 filas */
            width: 700px;
        }

        .bolita-tablero {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: inset -3px -3px 5px rgba(0,0,0,0.4), 1px 2px 3px rgba(0,0,0,0.3);
            transform: scale(0);
            animation: popInBolita 0.4s 2.2s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Retraso para que baje la animacion central */
            border: 1px solid rgba(255,255,255,0.1);
        }

        @keyframes popInBolita {
            to { transform: scale(1); }
        }

        #mensajeFinal {
            position: fixed;
            bottom: 20px;
            font-size: 1.5em;
            color: var(--color-principal);
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="titulo-marca">INNOMOTICS</h1>
        <h2 id="subtitulo-evento">Tómbola PANAM</h2>
    </header>

    <div id="main-container">
        <div id="numero-animado">00</div>
        <div id="contenedor-simulacion"></div>
        <div id="tablero"></div>
    </div>

    <div id="mensajeFinal"></div>

    <script>
        // --- Configuración y Módulos ---
        const contenedor = document.getElementById('contenedor-simulacion');
        const numeroAnimadoEl = document.getElementById('numero-animado');
        const diametroTombola = 450;
        const radioBolita = 18; // Ligeramente más pequeñas
        const VELOCIDAD_CONSTANTE = 6.5;

        const { Engine, Render, Runner, World, Bodies, Body, Events, Vector } = Matter;

        const engine = Engine.create();
        const world = engine.world;
        world.gravity.y = 0; // Sin gravedad, las bolitas flotan

        const render = Render.create({
            element: contenedor,
            engine: engine,
            options: {
                width: diametroTombola,
                height: diametroTombola,
                wireframes: false,
                background: 'transparent'
            }
        });

        // --- Crear el Anillo de la Tómbola (Estático) ---
        const radioTombola = diametroTombola / 2;
        const numParedes = 80; // Más paredes para un círculo más perfecto
        const espesorPared = 20;

        for (let i = 0; i < numParedes; i++) {
            const angle = (i / numParedes) * Math.PI * 2;
            const x = radioTombola + (radioTombola - 5) * Math.cos(angle);
            const y = radioTombola + (radioTombola - 5) * Math.sin(angle);
            
            const pared = Bodies.rectangle(x, y, 60, espesorPared, {
                isStatic: true,
                angle: angle,
                render: { fillStyle: '#1a1a1a' },
                friction: 0,
                restitution: 1, // Rebote perfecto
                collisionFilter: { group: -1 } // Evitar colisiones entre las paredes mismas
            });
            World.add(world, pared);
        }

        // --- Crear las 20 Bolitas (Físicas) ---
        const bolitasEnSimulacion = [];
        const coloresValidos = [
            '#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', 
            '#e67e22', '#34495e', '#1abc9c', '#d35400', '#27ae60'
        ];

        for (let i = 1; i <= 20; i++) {
            const color = coloresValidos[i % coloresValidos.length];
            const bolita = Bodies.circle(
                radioTombola + (Math.random() - 0.5) * 200,
                radioTombola + (Math.random() - 0.5) * 200,
                radioBolita,
                {
                    restitution: 1,
                    friction: 0,
                    frictionAir: 0,
                    render: { 
                        fillStyle: color,
                        strokeStyle: '#ffffff',
                        lineWidth: 1
                    },
                    label: i.toString()
                }
            );
            // Velocidad inicial aleatoria
            Body.setVelocity(bolita, { 
                x: (Math.random() - 0.5) * VELOCIDAD_CONSTANTE * 2, 
                y: (Math.random() - 0.5) * VELOCIDAD_CONSTANTE * 2 
            });
            bolitasEnSimulacion.push(bolita);
        }
        World.add(world, bolitasEnSimulacion);

        // Mantener la velocidad constante (afterUpdate)
        Events.on(engine, 'afterUpdate', () => {
            bolitasEnSimulacion.forEach(bolita => {
                const velocidadActual = Vector.magnitude(bolita.velocity);
                if (velocidadActual > 0) {
                    Body.setVelocity(bolita, Vector.mult(Vector.normalise(bolita.velocity), VELOCIDAD_CONSTANTE));
                }
            });
        });

        // --- Lógica del Sorteo (Punto 3) ---
        const bolitasSeleccionadas = [];
        const tablero = document.getElementById('tablero');
        const mensajeFinal = document.getElementById('mensajeFinal');
        let sorteoEnCurso = false;

        function seleccionarBolita() {
            if (sorteoEnCurso || bolitasEnSimulacion.length === 0) {
                if (bolitasEnSimulacion.length === 0) {
                    mensajeFinal.textContent = "¡Todas las bolitas han sido sorteadas!";
                }
                return;
            }
            sorteoEnCurso = true;
            mensajeFinal.textContent = "";

            const indiceAleatorio = Math.floor(Math.random() * bolitasEnSimulacion.length);
            const bolitaGanadora = bolitasEnSimulacion[indiceAleatorio];
            const numeroGanador = parseInt(bolitaGanadora.label, 10);
            const colorGanador = bolitaGanadora.render.fillStyle;

            // 1. Quitar la bolita física inmediatamente
            World.remove(world, bolitaGanadora);
            bolitasEnSimulacion.splice(indiceAleatorio, 1);
            
            // 2. Iniciar la animación central (salir de la tómbola)
            numeroAnimadoEl.textContent = numeroGanador;
            numeroAnimadoEl.style.backgroundColor = colorGanador; // La bolita que sale tiene su color
            numeroAnimadoEl.style.color = (parseInt(colorGanador.replace('#',''), 16) > 0xffffff/2) ? 'black' : 'white'; // Contraste
            numeroAnimadoEl.classList.add('animar');

            // 3. Crear el elemento del tablero (invisible hasta que baje)
            const bolitaTablero = document.createElement('div');
            bolitaTablero.classList.add('bolita-tablero');
            bolitaTablero.style.backgroundColor = colorGanador;
            bolitaTablero.textContent = numeroGanador;
            bolitaTablero.dataset.numero = numeroGanador; // Para ordenar luego

            // 4. Escuchar a que la animación central de "bajado" termine
            numeroAnimadoEl.addEventListener('animationend', (e) => {
                // Solo reaccionar cuando termine la animación salirYEncoger completa
                if (e.animationName === 'salirYEncoger') {
                    // Limpiar animación central
                    numeroAnimadoEl.classList.remove('animar');
                    
                    // Añadir la bolita al tablero y ordenarlo
                    anunciarEnTablero(bolitaTablero);
                    sorteoEnCurso = false;
                }
            }, { once: true });
        }

        function anunciarEnTablero(nuevaBolita) {
            // Añadir al tablero
            tablero.appendChild(nuevaBolita);
            
            // Obtener todas las bolitas y ordenarlas numéricamente
            const bolitasArr = Array.from(tablero.querySelectorAll('.bolita-tablero'));
            bolitasArr.sort((a, b) => parseInt(a.dataset.numero) - parseInt(b.dataset.numero));
            
            // Re-añadir en orden
            tablero.innerHTML = '';
            bolitasArr.forEach(b => tablero.appendChild(b));
        }

        // --- Iniciar la Simulación y Controles ---
        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        window.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault();
                seleccionarBolita();
            }
        });
    </script>
</body>
</html>
